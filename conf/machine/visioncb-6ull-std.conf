#@TYPE: Machine
#@NAME: SoMLabs i.MX6ULL VisionCB-6ULL-STD-SD
#@SOC: i.MX6ULL
#@DESCRIPTION: Machine configuration for VisionCB-6ULL-STD board 
#              with VisionSOM-6ULL SD-card version
#@MAINTAINER: Krzysztof Chojnowski <krzysztof.chojnowski@somlabs.com>

MACHINEOVERRIDES =. "mx6:mx6ul:mx6ull:somlabs:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
require conf/machine/include/somlabs.inc

UBOOT_CONFIG = "sd"
UBOOT_CONFIG[sd] = "visionsom_6ull_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "sdcard"

UBOOT_DTB_NAME = "imx6ull-visionsom.dtb"
UBOOT_MAKE_TARGET = "u-boot.imx"
UBOOT_SUFFIX = "imx"

SERIAL_CONSOLES = "115200;ttymxc0"

IMAGE_BOOT_FILES = " \
        ${KERNEL_IMAGETYPE} \
        ${@make_dtb_boot_files(d)} \
        splash.bmp \
"

KERNEL_DEVICETREE = "\
  nxp/imx/visioncb-6ull-std-emmc.dtb \
  nxp/imx/visioncb-6ull-std-emmc-btwifi.dtb \
  nxp/imx/visioncb-6ull-std-sd.dtb \
  nxp/imx/visioncb-6ull-std-sd-btwifi.dtb \
"

MACHINE_FEATURES += " wifi bluetooth "
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-murata-1dx"

BCM_FIRMWARE_SUFFIX = "somlabs,visionsom-6ull"
