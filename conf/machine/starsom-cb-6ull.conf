#@TYPE: Machine
#@NAME: SoMLabs i.MX6ULL StarSOM-CB-6ULL
#@SOC: i.MX6ULL
#@DESCRIPTION: Machine configuration for StarSOM-6ULL module
#              with StarCB-6ULL carrier board
#@MAINTAINER: Krzysztof Chojnowski <krzysztof.chojnowski@somlabs.com>

MACHINEOVERRIDES =. "mx6:mx6ul:mx6ull:somlabs:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv7a/tune-cortexa7.inc
require conf/machine/include/somlabs.inc

UBOOT_CONFIG = "sd"
UBOOT_CONFIG[sd] = "starsom_6ull_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "sdcard"

UBOOT_DTB_NAME = "imx6ull-somlabs-starsom.dtb"
UBOOT_MAKE_TARGET = "u-boot.imx"
UBOOT_SUFFIX = "imx"

SERIAL_CONSOLES = "115200;ttymxc3"

IMAGE_BOOT_FILES = " \
        ${KERNEL_IMAGETYPE} \
        ${@make_dtb_boot_files(d)} \
        splash.bmp \
"

KERNEL_DEVICETREE = "\
  nxp/imx/starsom-cb-6ull-emmc.dtb \
  nxp/imx/starsom-cb-6ull-emmc-btwifi.dtb \
  nxp/imx/starsom-cb-6ull-sd.dtb \
  nxp/imx/starsom-cb-6ull-sd-btwifi.dtb \
"

MACHINE_FEATURES += " wifi bluetooth "
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-murata-1dx"

BCM_FIRMWARE_SUFFIX = "somlabs,starsom-6ull"
