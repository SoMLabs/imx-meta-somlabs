#@TYPE: Machine
#@NAME: SoMLabs i.MX8MPlus StarSOM-8MP-CB
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for StarSOM-8MP-CB boards with StarSOM-8MP
#@MAINTAINER: Krzysztof Chojnowski <krzysztof.chojnowski@somlabs.com>

MACHINEOVERRIDES =. "mx8:mx8m:mx8mp:somlabs:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc
require conf/machine/include/somlabs.inc

UBOOT_CONFIG = "sd"
UBOOT_CONFIG[sd] = "starsom_8mp_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "sdcard"

SPL_BINARY = "spl/u-boot-spl.bin"

DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
        lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
        lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
        lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
        lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

UBOOT_CONFIG_BASENAME = "starsom_8mp"
UBOOT_DTB_NAME = "starsom-8mp.dtb"
UBOOT_SUFFIX = "bin"

IMXBOOT_TARGETS = "flash_evk"

IMX_BOOT_SOC_TARGET = "iMX8MP"

SERIAL_CONSOLES = "115200;ttymxc0"

IMAGE_BOOTLOADER = "imx-boot"

ATF_PLATFORM = "imx8mp"
ATF_LOAD_ADDR = "0x970000"
# we are using UART1 for console
SOC_ATF_BOOT_UART_BASE:somlabs := "0x30860000"

LOADADDR = ""
IMX_BOOT_SEEK = "32"

IMAGE_BOOT_FILES = " \
        ${KERNEL_IMAGETYPE} \
        ${@make_dtb_boot_files(d)} \
"

KERNEL_DEVICETREE = "\
  freescale/starsom-8mp-cb-adv.dtb \
"

MACHINE_FEATURES += " pci"
