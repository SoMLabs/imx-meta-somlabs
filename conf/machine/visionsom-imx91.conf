#@TYPE: Machine
#@NAME: SoMLabs i.MX91 VisionSOM-IMX91
#@SOC: i.MX91
#@DESCRIPTION: Machine configuration for VisionCB-IMX91 boards with VisionSOM-IMX91
#@MAINTAINER: Krzysztof Chojnowski <krzysztof.chojnowski@somlabs.com>

MACHINEOVERRIDES =. "mx91:somlabs:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/somlabs.inc

UBOOT_CONFIG = "sd"
UBOOT_CONFIG[sd] = "visionsom-imx91_defconfig"
UBOOT_CONFIG_IMAGE_FSTYPES[sd] = "sdcard"

SPL_BINARY = "spl/u-boot-spl.bin"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

UBOOT_CONFIG_BASENAME = "visionsom-imx91"
UBOOT_DTB_NAME = "visionsom-imx91.dtb"
UBOOT_SUFFIX = "bin"

IMXBOOT_TARGETS = "flash_singleboot"

IMX_BOOT_SOC_TARGET = "iMX91"

SERIAL_CONSOLES = "115200;ttyLP0"
IMX_DEFAULT_BSP = "nxp"

IMAGE_BOOTLOADER = "imx-boot"

ATF_PLATFORM = "imx91"

LOADADDR = ""
IMX_BOOT_SEEK = "32"

IMAGE_BOOT_FILES = " \
        ${KERNEL_IMAGETYPE} \
        ${@make_dtb_boot_files(d)} \
"

KERNEL_DEVICETREE = "\
  freescale/visionsom-imx91-cb-std.dtb \
"

MACHINE_FEATURES += " pci wifi bluetooth"
MACHINE_EXTRA_RRECOMMENDS += "linux-firmware-murata-1dx"

BCM_FIRMWARE_SUFFIX = "somlabs,visionsom-imx91"
